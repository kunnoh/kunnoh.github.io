<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <meta name="theme-color" content="#ffffff">

    <meta property="og:url" content="{{ site.domain }}">
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:image" content="https://kunnoh.github.io/image/kunnoh.png">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:description" content="{{ site.description }}">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ site.title }}">
    <meta name="twitter:description" content="{{ site.description }}">
    <meta name="twitter:image" content="https://kunnoh.github.io/image/kunnoh.png">

    <meta itemprop="name" content="{{ site.domain }}">
    <meta itemprop="description" content="{{ site.description }}">
    <meta itemprop="image" content="https://kunnoh.github.io/images/kunnoh.png">

    <meta name="description" content="{{ site.description }}">
    <meta name="keywords" content="{{ site.keywords }}">
    <link rel="canonical" href="{{ site.domain }}">
</head>
<body>
    {% include nav.html %}
    {{ content }}
</body>
</html>
