---
layout: default
title: Alvin - Blog
---
<main>
    <div class="row">
        <h3>My blogs</h3>
        <ul>
            {% for item in site.posts %}
                <li>
                    <a href="{{ item.link }}" {% if page.url == item.link %} class="current" {% endif %}>
                        {{ item.name }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>
</main>
